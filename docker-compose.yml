# Local development stack for the AI Hiring Platform.
# Usage:
#   docker compose up -d postgres redis qdrant
#   docker compose up --build          # full stack (infra + backend + frontend)
#
# Structured for later AWS deploy: named services, healthchecks, env-driven config.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hiring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiring_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hiring}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiring} -d ${POSTGRES_DB:-hiring}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hiring-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: hiring-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiring-backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hiring}:${POSTGRES_PASSWORD:-hiring_dev_password}@postgres:5432/${POSTGRES_DB:-hiring}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hiring-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
